<!-- leaderboard.html -->
<!DOCTYPE html>
<html>
    <head>
        <title>Leaderboard</title>
        <link rel="icon" type="image/png" href="icon.png" />
        <link rel="stylesheet" href="styles.css" />
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
        <script src="Scripts/supabaseClient.js" defer></script>
        <script src="Scripts/utils.js" defer></script>
        <script src="Scripts/leaderboard.js" defer></script>
    </head>
    <body>
        <img src="logo.png" alt="INSTOX Watermark" class="watermark-logo" />
        <div class="container">
            <h1>Team Leaderboard</h1>
            <div id="userInfo"></div>

            <div class="card">
                <div class="card-header">
                    <div class="card-title">Team Leaderboard</div>
                    <div class="card-description">
                        Teams ranked by total portfolio value and stock holdings
                    </div>
                </div>
                <div class="card-content">
                    <div id="leaderboardLoading" class="loading-message">Loading leaderboard...</div>
                    <table id="teamLeaderboardTable" class="data-table">
                        <thead>
                            <tr>
                                <th>Rank</th>
                                <th>Team</th>
                                <th id="thTotalValue" class="sortable">Total Value <span id="iconTotalValue">↕</span></th>
                                <th id="thProfit" class="sortable">Profit <span id="iconProfit">↕</span></th>
                                <th id="thStockQuantities" class="sortable">Stock Quantities <span id="iconStockQuantities">↕</span></th>
                                <th id="thPortfolioValue" class="sortable">Portfolio Value <span id="iconPortfolioValue">↕</span></th>
                            </tr>
                        </thead>
                        <tbody id="teamLeaderboardBody"></tbody>
                    </table>
                </div>
            </div>

            <div class="button-group">
                <button onclick="window.location.href='purchases.html'">Buy/Sell Stocks</button>
                <button class="secondary" onclick="window.location.href='index.html'">
                    Back to Home
                </button>
                <button class="destructive" onclick="logout()">Logout</button>
            </div>
        </div>
    </body>
</html>
