<!DOCTYPE html>
<html>
    <head>
        <title>Login - INSTOX</title>
        
        <link rel="icon" type="image/png" href="icon.png" />
        <link rel="stylesheet" href="styles.css" />

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
        <script src="Scripts/supabaseClient.js" defer></script>
        <script src="Scripts/utils.js" defer></script>
        <script src="Scripts/login.js" defer></script>
    </head>
    <body>
        <div class="hero-overlay"></div>
        <img src="logo.png" alt="INSTOX Watermark" class="watermark-center" />
        <img src="logo.png" alt="INSTOX Logo" class="watermark-logo" />

        <div class="content-wrapper">
            <header class="site-header">
                <div class="site-title">
                    <img src="logo.png" alt="INSTOX Logo" class="site-logo" />
                    <h1>Login - INSTOX</h1>
                </div>
                <p class="site-subtitle">Stock Market Simulation</p>
            </header>

            <div class="container">
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">Login</h2>
                    </div>
                    <div class="form-group">
                        <label for="username">Team Name</label>
                        <input
                            type="text"
                            id="username"
                            placeholder="Your Team Name"
                        />
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input 
                            type="password" 
                            id="password" 
                            placeholder="Your Password" 
                        />
                    </div>
                    <button onclick="login()">Login</button>
                </div>
            </div>

            <div id="errorMessage" class="error-message" style="display: none;"></div>
        </div>
    </body>
</html>
