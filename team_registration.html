<!--team_registration.html-->

<!DOCTYPE html>
<html>
    <head>
        <title>Team Registration</title>
        <link rel="icon" type="image/png" href="icon.png" />
        <link rel="stylesheet" href="styles.css" />

        <!-- load Supabase v2 and defer so supabaseClient can use it -->
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
        <script src="Scripts/supabaseClient.js" defer></script>
        <script src="Scripts/utils.js" defer></script>

        <script>
            document.addEventListener("DOMContentLoaded", function () {
                if (!initPage()) return;

                const form = document.getElementById("teamRegForm");
                const status = document.getElementById("regStatus");

                form.addEventListener("submit", async function (e) {
                    e.preventDefault();
                    status.innerText = "";
                    status.className = "";

                    const username = document.getElementById("teamUsername").value.trim();
                    const password = document.getElementById("teamPassword").value;
                    const role = document.getElementById("teamRole").value;

                    if (!username || !password || !role) {
                        status.innerText = "All fields are required.";
                        status.className = "error-message";
                        return;
                    }

                    try {
                        // Insert into your users table (username, password, role)
                        const { data, error } = await supabase
                            .from("users")
                            .insert([{ username, password, role }]);

                        if (error) throw error;

                        status.innerText = `Team "${username}" registered with role "${role}".`;
                        status.className = "success-message";
                        form.reset();
                    } catch (err) {
                        // show helpful message (unique constraint etc.)
                        status.innerText = err.message || String(err);
                        status.className = "error-message";
                    }
                });
            });
        </script>
    </head>
    <body>
        <img src="logo.png" alt="INSTOX Watermark" class="watermark-logo" />
        <div class="container">
            <h1>Team Registration (Admin Only)</h1>
            <div class="card">
                <div class="card-header">
                    <div class="card-title">Register a Team</div>
                    <div class="card-description">
                        Create a team login and assign a role
                    </div>
                </div>
                <div class="card-content">
                    <form id="teamRegForm">
                        <label>
                            Team Username:
                            <input type="text" id="teamUsername" required placeholder="TeamXX" />
                        </label>
                        <label>
                            Team Password:
                            <input type="password" id="teamPassword" required />
                        </label>
                        <label>
                            Role:
                            <select id="teamRole" required>
                                <option value="">Select role</option>
                                <option value="broker">Broker</option>
                                <option value="trader">Trader</option>
                            </select>
                        </label>
                        <button type="submit">Register Team</button>
                    </form>
                    <div id="regStatus"></div>
                </div>
            </div>
            <div class="button-group">
                <button class="secondary" onclick="window.location.href='index.html'">
                    Back to Home
                </button>
            </div>
        </div>
    </body>
</html>
