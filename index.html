<!-- index.html -->
<!DOCTYPE html>
<html>
    <head>
        <title>INSTOX - Stock Market Simulation</title>
        <link rel="icon" type="image/png" href="icon.png" />
        <link rel="stylesheet" href="styles.css" />
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="Scripts/supabaseClient.js" defer></script>
        <script src="Scripts/utils.js" defer></script>

        <script defer>
            window.addEventListener("DOMContentLoaded", () => {
                if (!initPage()) return;

                const role = getRole(); // use helper from utils.js
                const el = (id) => document.getElementById(id);

                // Hide/show buttons based on role
                if (role === "trader") {
                    el("portfolioBtn").style.display = "";
                    el("purchasesBtn").style.display = "none";
                    el("leaderboardBtn").style.display = "none";
                    el("teamRegBtn").style.display = "none";
                    el("adminButton").style.display = "none";
                } else if (role === "broker") {
                    el("portfolioBtn").style.display = "";
                    el("purchasesBtn").style.display = "";
                    el("leaderboardBtn").style.display = "";
                    el("teamRegBtn").style.display = "none";
                    el("adminButton").style.display = "none";
                } else if (role === "admin") {
                    el("portfolioBtn").style.display = "";
                    el("purchasesBtn").style.display = "";
                    el("leaderboardBtn").style.display = "";
                    el("teamRegBtn").style.display = "";
                    el("adminButton").style.display = "";
                }
            });
        </script>
    </head>
    <body>
        <div class="hero">
            <div class="hero-overlay"></div>

            <header class="site-header">
                <img src="logo.png" alt="INSTOX Logo" class="site-logo" />
                <div class="site-subtitle">WALL STREET OF OOW</div>
            </header>

            <main class="login-area">
                <div class="login-card">
                    <h2>LOGIN</h2>
                    <input id="teamUsername" class="login-input" placeholder="TEAM USERNAME" />
                    <input id="teamPassword" class="login-input" type="password" placeholder="TEAM PASSWORD" />
                    <button id="loginBtn" class="btn-primary">LOGIN</button>
                </div>
            </main>

            <!-- big subtle watermark centered -->
            <img src="logo.png" alt="INSTOX Watermark" class="watermark-center" />
        </div>
    </body>
</html>
