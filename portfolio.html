<!DOCTYPE html>
<html>
    <head>
        <title>Portfolio</title>
        <link rel="stylesheet" href="styles.css" />
        <link rel="icon" type="image/png" href="icon.png" />
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
        <script src="Scripts/supabaseClient.js" defer></script>
        <script src="Scripts/utils.js" defer></script>
        <script src="Scripts/portfolio.js" defer></script>
    </head>
    <body>
        <div class="hero-overlay"></div>
        <img src="logo.png" alt="INSTOX Watermark" class="watermark-center" />
        <img src="logo.png" alt="INSTOX Logo" class="watermark-logo" />

        <div class="content-wrapper">
            <header class="site-header">
                <div class="site-title">
                    <img src="logo.png" alt="INSTOX Logo" class="site-logo" />
                    <h1>My Portfolio</h1>
                </div>
                <div id="userInfo"></div>
            </header>

            <main class="container">
                <div class="select-container" id="portfolio-dropdown-container">
                    <p id="selectTeamText" style="display:none; color: var(--secondary-foreground); margin-bottom: 0.5rem; text-align: left;">Select the team:</p>
                </div>
                
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">Account Summary</h2>
                    </div>
                    <div class="account-summary">
                        <h2 id="cashInHand">Cash in Hand: ₹0</h2>
                        <h2 id="netWorth">Net Worth: ₹0</h2>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">Stocks Currently Owned</h2>
                    </div>
                    <div class="card-content" id="stocksOwned">
                        <p class="loading-message">Loading stocks...</p>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">Purchase History</h2>
                    </div>
                    <div class="card-content">
                        <table id="boughtTable" class="data-table">
                            <thead>
                                <tr>
                                    <th>Stock</th>
                                    <th>Quantity</th>
                                    <th>Price Each</th>
                                    <th>Total</th>
                                    <th>Date/Seller</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">Sale History</h2>
                    </div>
                    <div class="card-content">
                        <table id="soldTable" class="data-table">
                            <thead>
                                <tr>
                                    <th>Stock</th>
                                    <th>Quantity</th>
                                    <th>Price Each</th>
                                    <th>Total</th>
                                    <th>Date/Buyer</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>

                <div class="card" id="adjustmentsCard" style="display: none;">
                    <div class="card-header">
                        <h2 class="card-title">Adjustments History</h2>
                    </div>
                    <div class="card-content">
                        <table id="adjustmentsTable" class="data-table">
                            <thead>
                                <tr>
                                    <th>Type</th>
                                    <th>Amount</th>
                                    <th>Reason</th>
                                    <th>Date</th>
                                </tr>
                            </thead>
                            <tbody>
                                </tbody>
                        </table>
                    </div>
                </div>
                
                <div class="action-buttons">
                    <button onclick="window.location.href='purchases.html'">Buy/Sell Stocks</button>
                    <button class="secondary" onclick="window.location.href='index.html'">
                        Back to Home
                    </button>
                    <button class="destructive" onclick="logout()">Logout</button>
                </div>
            </main>
        </div>
    </body>
</html>
